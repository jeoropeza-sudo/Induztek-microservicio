spring.application.name=protocolos
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/induztek_protocolos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
instrumentos.service.url=${INSTRUMENTOS_SERVICE_URL:http://localhost:8086}
equipos.service.url=${EQUIPOS_SERVICE_URL:http://localhost:8083}
usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8082}
jwt.secreto=${JWT_SECRET}
security.internal-token=${INTERNAL_SERVICE_TOKEN}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Permitir fotos pesadas desde la cámara en Base64/JSON
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true