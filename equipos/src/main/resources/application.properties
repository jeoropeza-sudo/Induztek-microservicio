spring.application.name=equipos
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/induztek_equipos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
empresas.service.url=${EMPRESAS_SERVICE_URL:http://localhost:8081}
usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8082}
jwt.secreto=${JWT_SECRET}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true